title: "Captain's Notes"
description: "Practical notes from the field and from expeditions: lessons learned, recounted by the one who learned them."
author: Robert Douglas
github: https://github.com/realrobertdouglas
tagline: "The needs of the many outweigh the needs of the few."

enableTags: true
tagarray: []

# Every file in _posts is an entry; the post layout shows its date and categories
# _simple/<slug>.md holds an entry's "I am 5" version, matched to the post by slug; never output on its own
collections:
  simple:
    output: false

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, comments: false }

social: []

share:
  twitter_username:
  fb_appid: ""

url: "https://captainnotes.com"
baseurl: ""

markdown: kramdown

# Files kept in the repo but not published. Setting this replaces Jekyll's own list,
# so its defaults (Gemfile ... vendor, and CNAME from GitHub Pages) are repeated here.
exclude:
  - new-entry.sh
  - README.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  endings: all
  ignore:
    envs: ['development']
# UTC matches the GitHub Pages build, so post dates and URLs are the same locally and live
timezone: UTC
